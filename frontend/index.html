
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeVault</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">N</div>
                <h1>NodeVault</h1>
            </div>

            <p class="section-label">WORKSPACE</p>

            <button class="nav-item active" id="homeButton">
                <span class="nav-icon">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"/>
        <path d="M5.5 9.5V21h13V9.5"/>
        <path d="M9.5 21v-7h5v7"/>
    </svg>
</span>
                <span>Home</span>
            </button>
            
        <button class="nav-item" id="recycleBinButton" type="button">
            <span class="nav-icon">🗑</span>
            <span>Recycle Bin</span>
        </button>
        </aside>

        <!-- Main area -->
        <main class="main-content">

            <!-- Address bar -->
            <header class="topbar">
                    <div class="navigation-controls">
                    <button id="backButton" class="nav-button"
                            type="button" title="Back" aria-label="Back">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>

                    <button id="forwardButton" class="nav-button"
                            type="button" title="Forward" aria-label="Forward">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    </button>
                </div>
                <div class="breadcrumbs">
                    <span class="breadcrumb-home" aria-label="Home">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 10.5 12 3l9 7.5"/>
                        <path d="M5.5 9.5V21h13V9.5"/>
                        <path d="M9.5 21v-7h5v7"/>
                    </svg>
                </span>

                <span class="breadcrumb-divider">/</span>
                <span id="currentPath">Home</span>
                </div>
            </header>

            <div class="content">

                <!-- Actions -->
                <section class="toolbar">
                    <div class="toolbar-actions">
    <button class="button button-primary" id="newFolderButton">
        <span class="button-symbol">+</span>
        New Folder
    </button>

    <button class="button button-secondary" id="newFileButton">
        <span class="button-symbol">+</span>
        New File
    </button>

    <button class="button button-secondary" id="pasteButton" hidden>
        Paste
    </button>

    <button class="button button-secondary" id="cancelClipboardButton" hidden>
        Cancel
    </button>
</div>
                    <div class="view-toggle">
    <button
        id="gridViewButton"
        class="view-button active"
        type="button"
        title="Grid View"
        aria-label="Grid View"
        aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
    </button>

    <button
        id="listViewButton"
        class="view-button"
        type="button"
        title="List View"
        aria-label="List View"
        aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 6h13M8 12h13M8 18h13"/>
            <circle cx="3.5" cy="6" r="0.8"/>
            <circle cx="3.5" cy="12" r="0.8"/>
            <circle cx="3.5" cy="18" r="0.8"/>
        </svg>
    </button>
</div>
                    
                    
                </section>

                <!-- Diiiiiiirectory heading -->
                <section class="directory-heading">
                    <div>
                        <h2>All Items</h2>
                        <p id="itemCount">0 items</p>
                    </div>
                </section>

                <!-- Workspace -->
                <section class="file-area grid-view" id="fileArea">
                    <div class="empty-state">
                        <div class="empty-folder">📁</div>
                        <p>Ready to explore.</p>
                    </div>
                </section>

                <!-- Status -->
                <div class="status-message" id="statusMessage" role="status">
                    Ready to explore.
                </div>

            </div>
        </main>
    </div>

    <!-- Create dialogg-->
    <dialog id="createDialog" class="create-dialog">
        <form id="createForm">
            <div class="dialog-heading">
                <h2 id="dialogTitle">Create Folder</h2>

                <button
                    type="button"
                    class="dialog-close"
                    id="closeDialogButton"
                    aria-label="Close dialog"
                >×</button>
            </div>

            <label for="itemName">Name</label>
            <input
                id="itemName"
                name="itemName"
                type="text"
                maxlength="49"
                placeholder="Enter a name"
                required
                autocomplete="off"
            >
            <p id="dialogError" class="dialog-error" role="alert" hidden></p>

            

            <div class="dialog-actions">
                <button
                    type="button"
                    class="button button-secondary"
                    id="cancelButton"
                >Cancel</button>

                <button type="submit" class="button button-primary">
                    Continue
                </button>
            </div>
        </form>
    </dialog>
</body>
</html>
